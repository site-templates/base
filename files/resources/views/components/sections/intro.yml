# The visual editor's contract for sections/intro.blade.php.
# There is no photograph here on purpose — the header carries the only one.
title: Introduction
description: The name, the bio and the availability line
fields:
    name:
        type: text
        label: Name
        default: "Rowan Emerson"
    bio:
        type: textarea
        label: Bio
        description: Two lines. Who you are, where you are, what you write about.
        rows: 3
        default: "Independent developer in Lisbon, building small software products on my own. Writing about craft, shipping, and the parts of the job nobody demos."
    showStatus:
        type: toggle
        label: Show the availability line
        default: "1"
    status:
        type: text
        label: Availability
        default: "Taking on one project this autumn"
    statusHref:
        type: url
        label: Availability link
        default: "mailto:rowan@rowanemerson.com"
